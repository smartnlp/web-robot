<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Web Robot 聊天机器人</title>
    <link rel="stylesheet" href="robot/css/robot.css">
</head>
<body>
    <div id="robot-container" class="robot-container">
        <!-- 聊天窗口 -->
        <div class="robot-chat" id="robot-chat">
            <!-- 头部 -->
            <div class="robot-header">
                <div class="robot-header-title">
                    <span class="robot-icon">🤖</span>
                    <span class="robot-name">智能助手</span>
                </div>
                <div class="robot-header-actions">
                    <button class="robot-btn-export" id="btn-export" title="导出聊天记录">
                        <span>📥</span>
                    </button>
                    <button class="robot-btn-clear" id="btn-clear" title="清空聊天记录">
                        <span>🗑️</span>
                    </button>
                    <button class="robot-btn-close" id="btn-close" title="关闭">
                        <span>✕</span>
                    </button>
                </div>
            </div>
            
            <!-- 消息区域 -->
            <div class="robot-messages" id="robot-messages">
                <div class="robot-message robot-message-bot">
                    <div class="robot-avatar">🤖</div>
                    <div class="robot-bubble">
                        <div class="robot-content">你好！我是智能助手，有什么可以帮助你的吗？</div>
                        <div class="robot-time" id="welcome-time"></div>
                    </div>
                </div>
            </div>
            
            <!-- 快捷功能栏 -->
            <div class="robot-toolbar" id="robot-toolbar">
                <button class="toolbar-btn" data-action="export-txt" title="导出为TXT">📄 TXT</button>
                <button class="toolbar-btn" data-action="export-json" title="导出为JSON">📋 JSON</button>
            </div>
            
            <!-- 输入区域 -->
            <div class="robot-input-area">
                <div class="robot-input-box">
                    <textarea 
                        id="robot-input" 
                        class="robot-input" 
                        placeholder="请输入您的问题..."
                        rows="1"
                    ></textarea>
                    <button class="robot-send-btn" id="robot-send">
                        <span>发送</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 悬浮按钮 -->
        <div class="robot-float-btn" id="robot-float-btn">
            <span class="robot-float-icon">💬</span>
            <span class="robot-float-text">咨询</span>
        </div>
    </div>

    <!-- 导出选项弹窗 -->
    <div class="robot-modal" id="export-modal">
        <div class="robot-modal-content">
            <div class="robot-modal-header">
                <h3>导出聊天记录</h3>
                <button class="robot-modal-close" id="modal-close">✕</button>
            </div>
            <div class="robot-modal-body">
                <p>请选择导出格式：</p>
                <div class="export-options">
                    <button class="export-btn" data-format="txt">
                        <span class="export-icon">📄</span>
                        <span class="export-label">导出为 TXT</span>
                        <span class="export-desc">纯文本格式，便于阅读</span>
                    </button>
                    <button class="export-btn" data-format="json">
                        <span class="export-icon">📋</span>
                        <span class="export-label">导出为 JSON</span>
                        <span class="export-desc">结构化数据，便于处理</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="robot/robot.js"></script>
</body>
</html>
